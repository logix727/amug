name: Android CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - shell: pwsh
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - shell: pwsh
        run: .\gradlew.bat clean testDebugUnitTest lintRelease assembleRelease --no-daemon
