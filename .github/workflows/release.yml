name: Stable release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    environment: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: android-actions/setup-android@v3
      - shell: pwsh
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - shell: pwsh
        env: { KEYSTORE_BASE64: '${{ secrets.AMUG_KEYSTORE_BASE64 }}' }
        run: |
          if (-not $env:KEYSTORE_BASE64) { throw "Release keystore secret missing" }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\amug-release.jks", [Convert]::FromBase64String($env:KEYSTORE_BASE64))
      - shell: pwsh
        env:
          AMUG_KEYSTORE: '${{ runner.temp }}\amug-release.jks'
          AMUG_STORE_PASSWORD: '${{ secrets.AMUG_STORE_PASSWORD }}'
          AMUG_KEY_ALIAS: '${{ secrets.AMUG_KEY_ALIAS }}'
          AMUG_KEY_PASSWORD: '${{ secrets.AMUG_KEY_PASSWORD }}'
        run: .\gradlew.bat clean testDebugUnitTest lintRelease assembleRelease --no-daemon
      - shell: pwsh
        run: |
          & "$env:ANDROID_HOME\build-tools\36.0.0\zipalign.exe" -c -P 16 -v 4 app\build\outputs\apk\release\app-release.apk
          & "$env:ANDROID_HOME\build-tools\36.0.0\apksigner.bat" verify --verbose --print-certs app\build\outputs\apk\release\app-release.apk
          (Get-FileHash app\build\outputs\apk\release\app-release.apk -Algorithm SHA256).Hash.ToLower() | Set-Content app-release.apk.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
          body_path: RELEASE_NOTES_0.3.0.md
